repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest tests/ -q
        language: system
        pass_filenames: false

      - id: coverage
        name: pytest coverage (80% gate)
        entry: uv run --frozen pytest tests/ -q --cov=pycgtool --cov-report=term:skip-covered --cov-fail-under=80
        language: system
        pass_filenames: false
        stages: [manual]
