# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # no --all-extras: mdplus (backmapping) is sdist-only and fails to
        # build on the GCC 15 / -std=c23 default in current runner images;
        # no test imports it
        run: uv sync --locked --dev

      - name: Run pre-commit hooks
        # pytest is run as part of the coverage check
        run: uv run prek run --all-files --skip pytest

      - name: Run coverage gate
        run: uv run prek run coverage --all-files
