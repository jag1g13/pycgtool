[project]
name = "pycgtool"
version = "2.1.0a1"
description = "Generate coarse-grained molecular dynamics models from atomistic trajectories."
authors = [
    {name = "James Graham", email = "james.a.graham@kcl.ac.uk"},
    
]
license = "GPL-3.0-only"

readme = "README.md"

keywords = [
    "molecular-dynamics",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

requires-python = ">=3.10"
dependencies = [
    "mdtraj>=1.10.3",
    "numpy>=2.2.6",
    "rich>=14.2.0",
]

[project.urls]
homepage = "https://github.com/jag1g13/pycgtool"
repository = "https://github.com/jag1g13/pycgtool"
documentation = "https://pycgtool.readthedocs.io/en/main/"

[project.scripts]
# The actual entrypoint that users will call
pycgtool = "pycgtool.__main__:main"

[project.optional-dependencies]
cow = [
    "cowsay>=6.1",
]
backmapping = [
    "mdplus>=0.1.2",
]


[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "tox>=4.32.0",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.1",
    "sphinx-rtd-theme>=3.0.2",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
